name: GiftCard_Hunter
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Create hunter.py if missing
      run: |
        if [ ! -f hunter.py ]; then
          echo 'import sys
        import re
        import time
        import json
        import random
        import requests
        from datetime import datetime, timedelta
        from collections import deque

        TELEGRAM_TOKEN = "8914882875:AAGmoUu_Ckl16HA0wrcM6YICNz1ZH_WphCQ"
        TELEGRAM_CHAT_ID = "6306556778"

        def send_to_telegram(text, parse_mode="Markdown"):
            try:
                url = f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage"
                payload = {"chat_id": TELEGRAM_CHAT_ID, "text": text, "parse_mode": parse_mode}
                requests.post(url, json=payload, timeout=10)
            except:
                pass

        print("hunter.py created successfully")' > hunter.py
        fi
    - name: Install dependencies
      run: pip install requests
    - name: Run Auto Hunter
      run: python hunter.py
